
stages:
  - build
  - test
  - analyze
  - docker

variables:
  MAVEN_CLI_OPTS: "-B -V -ntp"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_LATEST: "$CI_REGISTRY_IMAGE:latest"

build:
  stage: build
  image: maven:3.9.3-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 hour

test:
  stage: test
  image: maven:3.9.3-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS test
  dependencies:
    - build
  artifacts:
    reports:
      junit: target/surefire-reports/*.xml
    expire_in: 1 hour

code_analysis:
  stage: analyze
  image: maven:3.9.3-eclipse-temurin-21
  script:
    - mvn $MAVEN_CLI_OPTS sonar:sonar -Dsonar.projectKey=$CI_PROJECT_NAME -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
  only:
    - main

docker_build:
  stage: docker
  image: docker:24.0.6
  services:
    - docker:24.0.6-dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker tag $DOCKER_IMAGE $DOCKER_LATEST
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_LATEST
  only:
    - main
